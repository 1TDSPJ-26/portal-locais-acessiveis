name: Verificação de qualidade

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint-build-test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Conferir os arquivos obrigatórios do projeto
        shell: bash
        run: |
          ausentes=()
          [[ -f package.json ]] || ausentes+=("package.json")
          [[ -f package-lock.json ]] || ausentes+=("package-lock.json")

          if (( ${#ausentes[@]} > 0 )); then
            echo "::error::Arquivo obrigatório ausente: ${ausentes[*]}"
            echo "Sem esses arquivos o CI não consegue verificar a alteração."
            echo "Execute 'npm install' e versione o package-lock.json gerado."
            exit 1
          fi

          echo "package.json e package-lock.json presentes."

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos
        run: npx tsc -b --force

      - name: Gerar build
        run: npm run build

      - name: Executar testes
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::warning::Nenhum script de teste definido no package.json — etapa não executada."
            echo "Enquanto não houver testes automatizados, esta etapa não verifica nada."
          fi
